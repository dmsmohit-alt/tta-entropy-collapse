# Shared defaults. Each experiment config (added in later phases) overrides these.
# Override from the command line with dotted keys, e.g.  stream.batch_size=64
experiment:
  name: default
  seed: 0                 # main seed; multi-seed runs use seeds listed below
  seeds: [0, 1, 2]        # >= 3 seeds for main experiments (mean +/- std)
  results_dir: results

compute:
  device: auto            # auto | cpu | cuda. Edit for your hardware (Colab/Kaggle T4 or CPU laptop)
  deterministic: true     # slower but reproducible (cudnn deterministic)
  input_layout: nchw      # nchw (contiguous; matches how the source model was trained; ~5-6x faster for batch-stat BN on the author's GPU)
                          # | as_is (channels_last strides from permute). TENT results are layout-SENSITIVE: see README / check_layout_equivalence.py

stream:                   # used from Phase 3 on; all sizes configurable for small machines
  batch_size: 200
  num_corruptions: 15     # set to 2-3 on a CPU laptop
  severity: 5
  num_cycles: 1           # repeat the corruption sequence this many times for long streams
  max_steps: null         # null = run the whole stream; set an int to truncate

metrics:
  ema_decay: 0.9          # EMA of H(p_bar)
  collapse_top_frac: 0.9  # collapse = top-class fraction above this ...
  collapse_patience: 5    # ... for this many consecutive batches
