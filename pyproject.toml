[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-collapse-tta"
version = "0.1.0"
description = "When does entropy minimisation at test time collapse? Dynamical analysis + stable updates."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Lets tests do `from src.metrics.entropy import ...` without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
